<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Buat Link Tamu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
  <style>
    :root {
      --ink: #3d3a35;
      --muted: #8a8377;
      --gold: #b08d57;
      --gold-soft: #d4bb94;
      --cream: #f8f1e7;
      --white: #ffffff;
      --font-body: "Jost", sans-serif;
      --font-serif: "Playfair Display", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--cream);
      padding: 32px 16px 64px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 {
      font-family: var(--font-serif);
      color: var(--gold);
      font-size: 1.7rem;
      margin: 0 0 4px;
    }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.92rem; }
    .card {
      background: var(--white);
      border: 1px solid #ddd3c3;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      margin: 0 0 16px;
      color: var(--ink);
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 14px 0 6px;
    }
    label:first-of-type { margin-top: 0; }
    input[type="text"], select, textarea {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.98rem;
      padding: 11px 14px;
      border: 1px solid #ddd3c3;
      border-radius: 10px;
      background: var(--white);
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--gold-soft);
      border-color: transparent;
    }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      font-family: var(--font-body);
      font-size: 0.95rem;
      border: none;
      border-radius: 999px;
      padding: 11px 22px;
      background: var(--gold);
      color: var(--white);
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { background: #9c7a48; }
    button.secondary {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold-soft);
      padding: 7px 14px;
      margin: 0 0 0 8px;
      font-size: 0.85rem;
    }
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #f6f1e8;
      display: none;
    }
    .result.is-visible { display: block; }
    .result__label { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    .result__value {
      font-size: 0.88rem;
      word-break: break-all;
      color: var(--ink);
      background: var(--white);
      border: 1px solid #ddd3c3;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .gate {
      max-width: 400px;
      margin: 120px auto;
      text-align: center;
    }
    .gate input { text-align: center; }
    .gate p { color: var(--muted); font-size: 0.85rem; }
    .decode-out { font-size: 0.92rem; }
    .decode-out b { color: var(--gold); }
  </style>
</head>
<body>

  <div class="wrap" id="gateView" hidden>
    <div class="gate">
      <h1>🔑 Admin</h1>
      <p>Masukkan kunci untuk mengakses generator link tamu.</p>
      <input type="text" id="gateKey" placeholder="Kunci admin" autocomplete="off" />
      <button id="gateBtn">Masuk</button>
    </div>
  </div>

  <div class="wrap" id="mainView" hidden>
    <h1>🔑 Buat &amp; Baca Link Tamu</h1>
    <p class="sub">Link tamu memuat nama &amp; bahasa dalam parameter <code>?g=</code> sehingga tamu tidak perlu mengetik ulang namanya di form ucapan.</p>

    <div class="card">
      <h2>Buat Link</h2>
      <label for="genName">Nama tamu</label>
      <input type="text" id="genName" placeholder="Budi &amp; Partner" />
      <label for="genLang">Bahasa</label>
      <select id="genLang">
        <option value="id">Indonesia</option>
        <option value="en">English</option>
      </select>
      <button id="genBtn">Buat Link</button>

      <div class="result" id="genResult">
        <div class="result__label">Hash (?g=)</div>
        <div class="result__value" id="genHash"></div>
        <div class="result__label">Link lengkap</div>
        <div class="result__value" id="genLink"></div>
        <button class="secondary" id="genCopyHash" type="button">Salin hash</button>
        <button class="secondary" id="genCopyLink" type="button">Salin link</button>
      </div>
    </div>

    <div class="card">
      <h2>Baca Link / Hash</h2>
      <label for="decInput">Tempel hash, ?g=..., atau link lengkap</label>
      <textarea id="decInput" rows="2" placeholder="cth: eyJ0byI6IkJ1ZGkgJiBQYXJ0bmVyIiwibGFuZyI6ImVuIn0"></textarea>
      <button id="decBtn">Decode</button>

      <div class="result" id="decResult">
        <div class="decode-out">
          Nama: <b id="decName"></b><br />
          Bahasa: <b id="decLang"></b>
        </div>
      </div>
      <p id="decError" style="color:#b3452c;"></p>
    </div>
  </div>

  <script>
    (function () {
      "use strict";
      const $ = (id) => document.getElementById(id);

      /* ---------- Encode/decode (sama dengan js/main.js) ---------- */
      function encodeGuestHash(obj) {
        const json = unescape(encodeURIComponent(JSON.stringify(obj)));
        return btoa(json).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
      function decodeGuestHash(hash) {
        try {
          const b64 = hash.replace(/-/g, "+").replace(/_/g, "/");
          const json = decodeURIComponent(escape(atob(b64)));
          const obj = JSON.parse(json);
          return obj && typeof obj === "object" ? obj : null;
        } catch {
          return null;
        }
      }
      function extractHash(input) {
        const s = input.trim();
        if (!s) return "";
        try {
          const u = new URL(s, location.href);
          const g = u.searchParams.get("g");
          if (g) return g;
        } catch {}
        const m = s.match(/[?&]g=([^&\s]+)/);
        if (m) return decodeURIComponent(m[1]);
        return s;
      }

      /* ---------- Gate ----------
         Tidak ada validasi client-side sungguhan (sama seperti ?admin=
         di index.html) — cukup ketahui bahwa perlu mengisi sesuatu di
         ?key= untuk masuk. Tidak disimpan di perangkat, jadi harus
         diisi ulang tiap kali membuka halaman ini. */
      const params = new URLSearchParams(location.search);
      const urlKey = (params.get("key") || "").trim();

      function showMain() {
        $("gateView").hidden = true;
        $("mainView").hidden = false;
      }
      function showGate() {
        $("mainView").hidden = true;
        $("gateView").hidden = false;
      }

      if (urlKey) {
        showMain();
      } else {
        showGate();
      }

      $("gateBtn").addEventListener("click", () => {
        const v = $("gateKey").value.trim();
        if (!v) return;
        const u = new URL(location.href);
        u.searchParams.set("key", v);
        location.href = u.toString();
      });
      $("gateKey").addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("gateBtn").click();
      });

      /* ---------- Generate ---------- */
      function copyText(text) {
        navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {});
      }

      $("genBtn").addEventListener("click", () => {
        const name = $("genName").value.trim();
        const lang = $("genLang").value;
        if (!name) return;
        const hash = encodeGuestHash({ to: name, lang: lang });
        const link = location.origin + location.pathname.replace(/admin\.html$/, "index.html") + "?g=" + hash;
        $("genHash").textContent = hash;
        $("genLink").textContent = link;
        $("genResult").classList.add("is-visible");
        $("genCopyHash").onclick = () => copyText(hash);
        $("genCopyLink").onclick = () => copyText(link);
      });

      /* ---------- Decode ---------- */
      $("decBtn").addEventListener("click", () => {
        $("decError").textContent = "";
        $("decResult").classList.remove("is-visible");
        const hash = extractHash($("decInput").value);
        if (!hash) {
          $("decError").textContent = "Masukkan hash atau link terlebih dahulu.";
          return;
        }
        const data = decodeGuestHash(hash);
        if (!data) {
          $("decError").textContent = "Hash tidak valid / tidak bisa didecode.";
          return;
        }
        $("decName").textContent = data.to || "(tidak ada)";
        $("decLang").textContent = data.lang || "(tidak ada)";
        $("decResult").classList.add("is-visible");
      });
    })();
  </script>
</body>
</html>
